[project]
name = "moneytotip"
version = "0.1.0"
description = "忙里偷题 (Money to Tip) — Small tips, big steps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "zstandard>=0.23",  # .apkg 的 collection.anki21b 是 zstd 压缩的 SQLite（R-anki-01）
    "python-multipart>=0.0.34",
    "httpx[socks]>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mtt = "mtt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
